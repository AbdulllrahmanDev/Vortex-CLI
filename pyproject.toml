[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vortex-cli"
version = "1.0.0"
description = "Next-Gen Ultra Media Engine & High-Speed Stream Grabber"
readme = "README.md"
authors = [{ name = "Abdulrahman" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "yt-dlp>=2024.0.0",
    "imageio-ffmpeg>=0.5.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "tqdm>=4.64.0",
]

[project.scripts]
vortex = "downloader_cli:main"
